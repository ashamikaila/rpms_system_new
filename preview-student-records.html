<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Records Preview | PRISM</title>
<link rel="stylesheet" href="assets/css/prism-tokens.css"><link rel="stylesheet" href="assets/css/prism-ui.css"><link rel="stylesheet" href="assets/css/prism-workspace.css"><link rel="stylesheet" href="assets/css/prism-components.css"><link rel="stylesheet" href="assets/css/student-records.css">
<style>body{margin:0;padding:32px;background:#f6f4f8;font-family:Montserrat,system-ui,sans-serif}.preview-shell{max-width:1200px;margin:auto}.preview-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.preview-toolbar input,.preview-toolbar button{padding:12px;border:1px solid #dedbe7;border-radius:10px;background:white;font:inherit}.preview-toolbar input{flex:1;min-width:180px}#previewFilters{position:static;max-width:100%;margin-bottom:20px}#previewFilters[hidden]{display:none}#previewResults{display:grid;gap:12px}.preview-banner{color:#a10f61;font-size:13px}.student-result-card .prism-badge{font-size:10px;padding:4px 8px;background:#e2f5eb;color:#14693a;border-radius:99px}.stage-tag{display:block;width:fit-content;background:#fce9f3;color:#b5146e;padding:4px 8px;border-radius:99px;margin-bottom:5px}.preview-more{width:36px;height:36px;background:white;border:1px solid #dedbe7;border-radius:8px} .preview-action-wrap{position:relative}.preview-action-menu{position:absolute;right:0;top:42px;z-index:20;width:190px;padding:6px;border:1px solid #dedbe7;border-radius:12px;background:#fff;box-shadow:0 10px 30px #0c0e3f20}.preview-action-menu[hidden]{display:none}.preview-action-menu button{display:block;width:100%;padding:10px;border:0;border-radius:6px;background:white;text-align:left;font:inherit;font-size:12px;cursor:pointer}.preview-action-menu button:hover{background:#fce9f3;color:#b5146e}#previewNotice{color:#b5146e;font-size:13px}</style>
</head><body class="prism-workspace student-records-page" data-management="student"><main class="preview-shell"><p class="preview-banner">TEST PREVIEW — sample records only. No account data is loaded or changed.</p><h1>Student Records</h1><div class="preview-toolbar"><input id="previewSearch" placeholder="Search name, ID, email or group" aria-label="Search sample students"><button id="previewToggle" type="button" aria-expanded="false" aria-controls="previewFilters">Filters</button></div>
<div id="previewFilters" class="prism-filter-panel" hidden><label>Academic units<select><option>All Academic units</option><option>School of Science</option></select></label><label>Programs<select><option>All Programs</option><option>BS Information Technology</option></select></label><label>Academic years<select><option>All Academic years</option><option>2026–2027</option></select></label><label>Year levels<select><option>All Year levels</option><option>Year 2</option></select></label><label>Research groups<select id="previewGroup"><option value="">All Research groups</option><option>AMT-BSIT-Y2-2627-G01</option><option>NURSING-BSN-Y4-2627-G02</option></select></label><label>Stages<select id="previewStage"><option value="">All Stages</option><option>Protocol Submission</option><option>Initial Ethics Review</option><option>Revisions &amp; Resubmission</option></select></label><label>Statuses<select><option>All Statuses</option><option>On Track</option></select></label><label>Protocol status<select><option>All Protocol status</option><option>Assigned</option></select></label><label>Research advisers<select><option>All Research advisers</option><option>Sample Adviser</option></select></label><button id="previewClear" type="button">Clear Filters</button></div><p id="previewCount"></p><p id="previewNotice" role="status"></p><div id="previewResults"></div></main>
<script>
const students=[['Ana Santos','2026-1001','Research Progress Tracker','AMT-BSIT-Y2-2627-G01','Protocol Submission','CEU-IERB-1234'],['Carlo Reyes','2026-1002','Community Health Study','NURSING-BSN-Y4-2627-G02','Initial Ethics Review','Not yet assigned'],['Julia Cruz','2026-1003','Student Learning Research','AMT-BSIT-Y2-2627-G01','Revisions & Resubmission','Not yet assigned']];
const results=document.getElementById('previewResults'), search=document.getElementById('previewSearch'), stage=document.getElementById('previewStage'), group=document.getElementById('previewGroup');
function render(){const rows=students.filter(s=>s.join(' ').toLowerCase().includes(search.value.toLowerCase())&&(!stage.value||s[4]===stage.value)&&(!group.value||s[3]===group.value));document.getElementById('previewCount').textContent=rows.length+' sample records';results.replaceChildren();rows.forEach(s=>{const card=document.createElement('article');card.className='student-result-card';card.innerHTML=`<div class="student-name-layout"><span class="student-avatar">${s[0].split(' ').map(n=>n[0]).join('')}</span><span class="student-name-copy"><strong>${s[0]}</strong><small>ID ${s[1]}</small><small>student@example.invalid</small></span></div><div><small class="student-result-label">Research / Group</small><strong>${s[2]}</strong><small>${s[3]}</small></div><div><small class="student-result-label">IERB status</small><span class="stage-tag">${s[4]}</span><span class="prism-badge">On Track</span></div><div><small class="student-result-label">Protocol / PI</small><small>${s[5]}</small></div><div class="student-result-actions"><button class="student-result-view" type="button">View student</button><div class="preview-action-wrap"><button class="preview-more" type="button" aria-label="More student actions" aria-expanded="false">&#8943;</button><div class="preview-action-menu" hidden><button type="button">Edit student</button><button type="button">Resend invitation</button><button type="button">Assign adviser</button><button type="button">Archive student</button></div></div></div><details class="student-result-details"><summary>Show academic details</summary><p>Academic year: 2026–2027 · Research adviser: Sample Adviser</p></details>`;card.querySelector('button').onclick=()=>{const d=card.querySelector('details');d.open=!d.open};const more=card.querySelector('.preview-more'),menu=card.querySelector('.preview-action-menu');more.onclick=()=>{const open=menu.hidden;document.querySelectorAll('.preview-action-menu').forEach(m=>m.hidden=true);document.querySelectorAll('.preview-more').forEach(b=>b.setAttribute('aria-expanded','false'));menu.hidden=!open;more.setAttribute('aria-expanded',String(open))};menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.getElementById('previewNotice').textContent=b.textContent+' selected for '+s[0]+'. Preview only — no records changed.';menu.hidden=true;more.setAttribute('aria-expanded','false')});results.append(card)});if(!rows.length)results.textContent='No matching sample records.'}
document.getElementById('previewToggle').onclick=function(){const p=document.getElementById('previewFilters');p.hidden=!p.hidden;this.setAttribute('aria-expanded',String(!p.hidden))};search.oninput=render;stage.onchange=render;group.onchange=render;document.getElementById('previewClear').onclick=()=>{document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);search.value='';render()};render();
</script></body></html>
